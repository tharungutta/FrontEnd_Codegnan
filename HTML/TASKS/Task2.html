<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-1</title>
    <style>
        #full{
            background-color: pink;
        }
    </style>
    
</head>
<body id="full">
       <center>
        <h1>Student Registration form</h1>

      <table>
        <form action="" autocomplete="on">
            <tr>
                <td><label for="rollNo" >Roll no :</label></td>
                <td><input type="number" name="" id=""   style="width: 400px;" required autofocus></td>
            </tr>
            <tr>
                <td><label for="name" >Student name :</label></td>
                <td><input type="text" name="" id="" placeholder="First Name" style="width: 190px;">
                     - 
                     <input type="text" name="" id="" placeholder="Last Name" style="width: 190px;"></td>
                
            </tr>
            <tr>
                <td><label for="fname" >Fathers name :     </label></td>
                <td><input type="text" name="" id="" style="width: 400px;" ></td>
            </tr>
            <tr>
                <td><label for="birth" >Date of birth </label>:</label></td>
                <td><input type="number" name="" id="" style="width: 60px;" placeholder="Day"> - 
                     <input type="number" name="" id="" style="width: 80px; " placeholder="Month"> - 
                     <input type="number" name="" id="" style="width: 120px;" placeholder="Year">
                </td>
            </tr>

            <tr>
                <td><label for="">Mobile no :</label></td>
                <td> <input type="text" style="width: 30px;" placeholder="+91"> - 
                     <input type="number" name="" id="" minlength="10" maxlength="10" >
                </td>
            </tr>
            <tr>
                <td><label for=" >Email id :     </label></td>
                <td><input type="email" name="" id="" style="width: 400px;" ></td>
            </tr>
            <tr>
                <td><label for="pass" >Passsword :     </label></td>
                <td><input type="text" name="" id="" minlength="10" maxlength="16" style="width: 400px;" ></td>
            </tr>
            <tr>
                <td><label for="fname" >Gender :     </label></td>
                <td><input type="radio" name="radio" id=""  ><label for="male">Male</label><input type="radio" name="radio" id="" ><label for="female">Female</label></td>
            </tr>
            <tr>
                <td><label for="">Department :</label></td>
                <td>
                    <input type="checkbox" name="" id=""><label for="">CSE</label>
                    <input type="checkbox" name="" id=""><label for="">IT</label>
                    <input type="checkbox" name="" id=""><label for="">ECE</label>
                    <input type="checkbox" name="" id=""><label for="">Civil</label>
                    <input type="checkbox" name="" id=""><label for="">Mech</label>
                </td>
            </tr>
            <tr>
                <td><label for="">Course :</label></td>
                <td>
                    <select name="" id="">
                        <option value="">------------------------------ Select Current Course's ------------------------------ </option>
                        <option value="">Webtech</option>
                        <option value="">Backend</option>
                        <option value="">Database</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="">Student photo :</label></td>
                <td><input type="file" name="" id=""></td>
            </tr>
            <tr>
                <td><label for="">City : </label></td>
                <td><input type="text" name="" id="" style="width: 400px;"></td>
            </tr>
            <tr>
                <td>Address :</td>
                <td><textarea name="" id="" rows="4"  style="width: 400px;" ></textarea></td>
            </tr>
            <tr>
                <td></td>
                <td><center><button type="submit">Register</button></center></td>
            </tr>
         
        </form>
      </table>
       </center>
</body>
</html>
