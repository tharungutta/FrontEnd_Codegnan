<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form- Task</title>
    <style>
        #full{
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #form-b{
            background-color: white;
            width: 550px;
            border-radius: 4px;
            padding: 10px;
            border: 1px solid black;
            box-sizing: border-box;
            box-shadow: 1px 2px 4px black;
        }
    </style>
</head>
<body id="full">
    <center >
            <form action="" autocomplete="on" id="form-b">
                <table>
                    <h1>Student Registration form</h1>
                 <tr>
                    <td><label for="">Student Name</label></td>
                    <td></td>
                 </tr>
                 <tr>
                    <td colspan="2"><input type="text"  style="width: 500px;" autofocus></td>
                 </tr>
                <tr>
                    <td><label for="" >Mobile No</label></td>
                    <td><label for="">Email Id</label></td>
                </tr>
                <tr>
                    <td><input type="number" style="width: 242px;"></td>
                    <td><input type="email" style="width: 242px;"></td>
                </tr>
                <tr>
                    <td><label for="">Father Name</label></td>
                    <td><label for="">Mother Name</label></td>
                </tr>
                <tr>
                    <td><input type="text" style="width: 242px;"></td>
                    <td><input type="text" style="width: 242px;"></td>
                </tr>
                <tr>
                    <td><label for="">Select Course</label></td>
                    <td><label for="">Date Of Birth</label></td>
                </tr>
                <tr>
                    <td>
                        <select name="" id="" style="width: 244px;">
                            <option value="">Select.....</option>
                            <option value="">Frontend</option>
                            <option value="">Backend</option>
                            <option value="">Database</option>
                        </select>
                    </td>
                    <td><input type="date" style="width: 244px;"></td>
                </tr>
                <tr>
                    <td><label for="">Gender</label></td>
                    <td><label for="">Student Photo</label></td>
                </tr>
                <tr>
                    <td>
                        <input type="radio" name="radio"> <label for="">Male</label>
                        <input type="radio" name="radio"> <label for="">Female</label>
                    </td>
                    <td><fieldset><input type="file" style="width: 205px;"></fieldset></td>
                </tr>
                <tr>
                    <td>Select Branch</td>
                    <td></td>
                </tr>
                <tr>
                    <td>
                        <input type="checkbox"><label for="">CSE</label>
                        <input type="checkbox"><label for="">IT</label>
                        <input type="checkbox"><label for="">ECE</label>
                        <input type="checkbox"><label for="">Civil</label>
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td><label for="">Address</label></td>
                    <td></td>
                </tr>
                 <tr>
                    <td colspan="2">
                        <textarea name="" id="" rows="5" style="width: 500px;"></textarea>
                    </td>
                 </tr>
                <tr>
                    <td colspan="2"><button type="submit" style="width: 510px; background-color: red; color: white; border-radius: 2px;"> Submit</button></td>
                </tr>
                </table>
            </form>
    
    </center>
</body>
</html>
